---
- name: Instalação das ferramentas DEV
  hosts: all

  vars:
    # Release corrente da linha Maven 3 (3.10.0, de 2026-10-01). Para
    # atualizar, troque aqui e em maven_sha512; as versoes publicadas estao
    # em https://archive.apache.org/dist/maven/maven-3/
    #
    # Roda em Java 8+ -- o maven-core do 3.10.0 e bytecode major 52, igual
    # ao do 3.9.x. Isso importa porque as tres distros deste playbook
    # instalam JDKs diferentes (11 no Amazon Linux 2, 21 no Ubuntu, 22 no
    # Amazon Linux 2023) e as tres compartilham esta variavel.
    #
    # O Quarkus 3.x exige "[3.9.0,)", e o 3.10.0 satisfaz: na ordenacao do
    # Maven o segmento e numerico, entao 3.10.0 > 3.9.16 > 3.9.0 (nao e
    # comparacao de string, em que "3.10" viria antes de "3.9").
    #
    # Nao o Maven 4: em 2026-11 a Apache so publicou candidatos a release
    # (o mais novo e o 4.0.0-rc-7), nao ha GA. E o maven-core dele e
    # bytecode major 61, ou seja, exige Java 17+ -- quebraria o caminho do
    # Amazon Linux 2, que fica no Java 11.
    maven_version: "3.10.0"

    # O checksum fica fixo aqui, e nao como URL no parametro checksum do
    # get_url, de proposito. O get_url baixa a URL do checksum ANTES de
    # olhar se o arquivo de destino ja esta no disco com o hash certo
    # (modules/get_url.py: o fetch do checksum vem antes do early exit
    # "file already exists"). Ou seja: com o checksum remoto, toda execucao
    # do playbook vai a rede buscar o .sha512, mesmo numa VM onde o Maven
    # ja esta instalado -- e foi exatamente esse fetch que estourou o
    # handshake TLS do archive.apache.org. Com o hash fixo, uma VM ja
    # provisionada nao toca a rede.
    #
    # Ao trocar maven_version, atualize este valor. Ele e publicado ao lado
    # do tar.gz:
    #   curl -s https://downloads.apache.org/maven/maven-3/<versao>/binaries/apache-maven-<versao>-bin.tar.gz.sha512
    maven_sha512: "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa"

    # Mirrors tentados em ordem, do mais rapido para o mais completo:
    #
    # - downloads.apache.org fica atras da CDN da Apache, aguenta IP de
    #   nuvem e so guarda a versao corrente de cada linha -- entao e o
    #   mirror certo enquanto maven_version for a release corrente, que e
    #   mais um motivo para nao deixar a versao envelhecer aqui: quando ela
    #   sai do downloads, o lab cai no archive e volta a tomar timeout.
    # - archive.apache.org guarda tudo para sempre, mas e host unico, sem
    #   CDN, e com rate limit agressivo: de dentro da AWS o handshake TLS
    #   simplesmente nao fecha nos 10s de timeout padrao do get_url. Fica
    #   como reserva, para quando maven_version sair do downloads.
    maven_mirrors:
      - "https://downloads.apache.org/maven/maven-3"
      - "https://archive.apache.org/dist/maven/maven-3"

  tasks:

    # ============================================================
    # Amazon Linux 2
    # ============================================================

    # Antes esta task pedia o 3.9.8 ao downloads.apache.org, que ja o apagou
    # (404) -- e o shell rodava sem "set -e": o wget falhava calado, o tar
    # falhava, mas o "cat > /etc/profile.d" no fim dava rc 0 e a task era
    # reportada como ok. Resultado: VM sem Maven, playbook verde. Agora usa
    # a mesma versao, lista de mirrors e checksum do caminho Ubuntu, com
    # "set -euo pipefail" para a falha aparecer.
    - name: Instalar Java 11 e Maven no Amazon Linux 2
      become: true
      shell: |
        set -euo pipefail

        amazon-linux-extras install java-openjdk11 -y

        tarball="/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"

        # Nao rebaixa o tar.gz se ele ja estiver no disco com o hash certo.
        if ! echo "{{ maven_sha512 }}  $tarball" | sha512sum -c - >/dev/null 2>&1; then
          rm -f "$tarball"
          for base in {{ maven_mirrors | join(' ') }}; do
            url="$base/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
            # O "if" protege o curl do set -e, para que o mirror seguinte
            # ainda seja tentado.
            if curl -fsSL --connect-timeout 15 --max-time 300 -o "$tarball" "$url"; then
              break
            fi
            echo "mirror falhou, tentando o proximo: $base" >&2
            rm -f "$tarball"
          done
          # Se nenhum mirror respondeu, o arquivo nao existe e o sha512sum
          # abaixo derruba a task com a mensagem certa.
          echo "{{ maven_sha512 }}  $tarball" | sha512sum -c -
        fi

        rm -rf "/opt/apache-maven-{{ maven_version }}"
        tar xf "$tarball" -C /opt

        ln -sfn "/opt/apache-maven-{{ maven_version }}" /opt/maven

        # Mesmo motivo do link no caminho Ubuntu: /etc/profile.d so vale em
        # shell de login, e /usr/local/bin vem antes de /usr/bin no PATH.
        ln -sfn /opt/maven/bin/mvn /usr/local/bin/mvn

        cat > /etc/profile.d/java-maven.sh <<'EOF'
        export JAVA_HOME=/usr/lib/jvm/jre-11-openjdk
        export M2_HOME=/opt/maven
        export MAVEN_HOME=/opt/maven
        export PATH=/opt/maven/bin:$PATH
        export SONAR_SCANNER_OPTS="-Xmx512m"
        EOF
      args:
        executable: /bin/bash
        creates: "/opt/apache-maven-{{ maven_version }}/bin/mvn"
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version == "2"


    # ============================================================
    # Amazon Linux 2023
    # ============================================================

    - name: Instalar Java 22 e Maven no Amazon Linux 2023
      become: true
      ansible.builtin.package:
        name:
          - java-22-amazon-corretto-devel
          - maven
        state: present
        disable_gpg_check: true
        lock_timeout: 180
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version == "2023"


    # ============================================================
    # Ubuntu / Debian
    # ============================================================

    - name: Instalar Java 21 no Ubuntu
      become: true
      # Teto de tempo por tentativa. Sem isto, um apt-get pendurado (mirror
      # que para de enviar dados no meio do download) trava a etapa
      # inteira em vez de falhar e deixar o retries/until abaixo agir.
      async: 300
      poll: 5
      # O maven sai do apt: o Ubuntu 24.04 empacota o 3.8.7, e o Quarkus
      # 3.x exige Maven >= 3.9.0 ("Detected Maven Version (3.8.7) is not
      # supported"). Ele e instalado da Apache logo abaixo, em /opt/maven
      # -- o caminho que o M2_HOME e o PATH deste playbook ja apontavam.
      apt:
        name:
          - openjdk-21-jdk
          - maven-repo-helper
        state: present
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
      register: apt_action
      retries: 3
      until: apt_action is success
      when: ansible_os_family == "Debian"


    # Tirar o maven da lista do apt nao desinstala quem ja tinha o pacote:
    # em VMs que rodaram a versao anterior deste playbook, o 3.8.7 continua
    # em /usr/bin/mvn e convive com o 3.9.x de /usr/local/bin/mvn. Os dois
    # funcionam e a escolha fica so por ordem de PATH -- fragil, e dificil
    # de diagnosticar (foi assim que um "mvn --version" apareceu como 3.8.7
    # mesmo com o playbook novo no disco). Remover deixa um mvn so.
    #
    # Seguro: o maven-repo-helper instalado acima depende apenas de JRE,
    # nao do pacote maven, entao nao volta por dependencia.
    - name: Remover o maven do apt no Ubuntu (conflita com o da Apache)
      become: true
      async: 300
      poll: 5
      apt:
        name: maven
        state: absent
      when: ansible_os_family == "Debian"


    # Tenta cada mirror de maven_mirrors, em ordem, e para no primeiro que
    # entregar o arquivo: com o checksum fixo (e nao como URL), o get_url
    # sai na hora com "file already exists" quando o tar.gz ja esta no
    # disco com o hash certo, sem abrir conexao -- entao as iteracoes
    # seguintes a que baixou nao vao a rede.
    #
    # timeout: 30 porque o padrao do get_url e 10s, e foi nele que a versao
    # anterior morreu ("elapsed": 10) contra o archive.apache.org.
    #
    # ignore_errors para que o mirror que falhar nao derrube a play antes de
    # o proximo ser tentado; quem decide se o download deu certo e o assert
    # logo abaixo.
    - name: Baixar Maven {{ maven_version }} da Apache no Ubuntu
      become: true
      get_url:
        url: "{{ item }}/{{ maven_version }}/binaries/apache-maven-{{ maven_version }}-bin.tar.gz"
        dest: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
        checksum: "sha512:{{ maven_sha512 }}"
        mode: "0644"
        timeout: 30
      loop: "{{ maven_mirrors }}"
      register: maven_download
      retries: 2
      delay: 5
      until: maven_download is success
      ignore_errors: true
      when: ansible_os_family == "Debian"


    # Checa o resultado pelo disco, e nao pelo registro das tentativas:
    # pega tambem o caso de um /tmp com tar.gz truncado de uma execucao
    # anterior.
    - name: Conferir o tar.gz do Maven baixado no Ubuntu
      become: true
      stat:
        path: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
        checksum_algorithm: sha512
      register: maven_tar
      changed_when: false
      when: ansible_os_family == "Debian"


    - name: Falhar se nenhum mirror da Apache entregou o Maven no Ubuntu
      ansible.builtin.assert:
        that:
          - maven_tar.stat.exists
          - maven_tar.stat.checksum == maven_sha512
        fail_msg: >-
          Nao foi possivel baixar o Maven {{ maven_version }} de nenhum
          mirror ({{ maven_mirrors | join(', ') }}). Se o erro foi timeout
          de handshake TLS, o archive.apache.org costuma estar limitando o
          IP de saida -- confira se maven_version ainda e a versao corrente
          em https://downloads.apache.org/maven/maven-3/ e, se nao for,
          atualize maven_version e maven_sha512.
        success_msg: "Maven {{ maven_version }} conferido pelo sha512."
      when: ansible_os_family == "Debian"


    - name: Extrair Maven em /opt no Ubuntu
      become: true
      unarchive:
        src: "/tmp/apache-maven-{{ maven_version }}-bin.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/apache-maven-{{ maven_version }}/bin/mvn"
      when: ansible_os_family == "Debian"


    - name: Apontar /opt/maven para o Maven {{ maven_version }} no Ubuntu
      become: true
      file:
        src: "/opt/apache-maven-{{ maven_version }}"
        dest: /opt/maven
        state: link
        force: true
      when: ansible_os_family == "Debian"


    # O /etc/profile.d so vale em shell de login. O link em /usr/local/bin,
    # que vem antes de /usr/bin no PATH padrao, garante o mesmo mvn em
    # qualquer contexto -- terminal do code-server, tasks do Ansible, e
    # VMs antigas onde o mvn 3.8.7 do apt ainda esteja instalado.
    - name: Expor mvn em /usr/local/bin no Ubuntu
      become: true
      file:
        src: /opt/maven/bin/mvn
        dest: /usr/local/bin/mvn
        state: link
        force: true
      when: ansible_os_family == "Debian"


    - name: Detectar JAVA_HOME no Ubuntu
      become: true
      shell: |
        dirname "$(dirname "$(readlink -f "$(which java)")")"
      args:
        executable: /bin/bash
      register: java_home
      changed_when: false
      when: ansible_os_family == "Debian"


    - name: Configurar variáveis de ambiente Java e Maven no Ubuntu
      become: true
      blockinfile:
        path: /etc/environment
        marker: "# {mark} ANSIBLE JAVA/MAVEN"
        block: |
          JAVA_HOME={{ java_home.stdout }}
          M2_HOME=/opt/maven
          MAVEN_HOME=/opt/maven
      when: ansible_os_family == "Debian"


    - name: Configurar perfil Java e Maven no Ubuntu
      become: true
      copy:
        dest: /etc/profile.d/java-maven.sh
        mode: "0644"
        content: |
          export JAVA_HOME={{ java_home.stdout }}
          export M2_HOME=/opt/maven
          export MAVEN_HOME=/opt/maven
          export PATH=/opt/maven/bin:$PATH
      when: ansible_os_family == "Debian"


    # ============================================================
    # Verificação
    # ============================================================

    - name: Verificar Java e Maven
      shell: |
        echo "JAVA_HOME=$JAVA_HOME"
        echo ""
        java --version
        echo ""
        mvn --version
      args:
        executable: /bin/bash
      environment:
        JAVA_HOME: "{{ java_home.stdout | default('') }}"
        M2_HOME: /opt/maven
        MAVEN_HOME: /opt/maven
        PATH: "/opt/maven/bin:{{ ansible_env.PATH }}"
      register: java_maven_log
      changed_when: false

    - name: Mostrar Java e Maven
      debug:
        msg: "{{ java_maven_log.stdout }}"
