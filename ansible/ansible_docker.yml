---
# https://docs.ansible.com/ansible/2.9/modules/modules_by_category.html
# https://docs.ansible.com/ansible/latest/user_guide/playbooks_conditionals.html#playbooks-conditionals
# https://docs.ansible.com/ansible/latest/user_guide/playbooks_loops.html#playbooks-loops

  - name: Instalar o Docker
    hosts: all
    become: yes
    tasks:
        # PRE-REQS DO UBUNTU
        - name: Instalar pré-reqs (ubuntu)
          # Mesmo teto das demais tasks de apt: estas tinham ficado de fora, e
          # um apt pendurado aqui travaria a etapa do mesmo jeito.
          async: 300
          poll: 5
          apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - software-properties-common
            state: present
            update_cache: true
          when: ansible_os_family == "Debian"
        # O modulo apt_key esta depreciado e o binario apt-key saiu de
        # circulacao nas releases recentes. O metodo atual e um keyring
        # dedicado, referenciado por signed-by na linha do repositorio.
        - name: Criar diretorio de keyrings do apt (ubuntu)
          become: yes
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: '0755'
          when: ansible_os_family == "Debian"

        - name: Baixar a chave GPG do Docker (ubuntu)
          become: yes
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: '0644'
          when: ansible_os_family == "Debian"

        # O apt_repository antigo gerava este arquivo a partir da URL.
        # Numa VM reaproveitada ele sobreviveria com o "focal" fixo e
        # brigaria com a linha nova, entao removemos explicitamente.
        - name: Remover repo antigo do Docker fixado em focal (ubuntu)
          become: yes
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
            state: absent
          when: ansible_os_family == "Debian"

        # O release estava fixo em "focal" mesmo rodando numa noble --
        # funcionava por sorte, e a distancia so cresce a cada release.
        # Agora acompanha a distro e a arquitetura reais do host.
        - name: Adicionar Docker repo (ubuntu)
          become: yes
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            filename: docker
            state: present
            update_cache: true
          when: ansible_os_family == "Debian"

        # INSTALL
        - name: Instalar o Docker via amazon-linux-extras no Amazon Linux 2
          shell: |
            amazon-linux-extras install docker -y
          when: (ansible_os_family == "RedHat") and (ansible_distribution_version == "2")

        - name: Instalar o Docker via dfm no Amazon Linux 2023
          become: yes
          ansible.builtin.package:
            name: 
             - docker
            #state: latest
            state: present
            disable_gpg_check: yes
            lock_timeout: 180
          when: (ansible_os_family == "RedHat") and (ansible_distribution_version == "2023")

        - name: Instalar o Docker via apt (ubuntu)
          become: yes
          apt:
            name:
              - docker-ce
              - docker-ce-cli 
              - containerd.io 
              - docker-buildx-plugin 
              - docker-compose-plugin
            state: present
            update_cache: true
            cache_valid_time: 3600
            force_apt_get: true
          register: apt_action
          # Teto dimensionado por medicao, nao por palpite: a maior task de apt
          # observada levou 42,7s, entao 300s da ~7x de folga para dia de mirror
          # ruim ou release com mais pacotes, e ainda corta travamento cedo.
          # O valor anterior, 1800s, era 42x o observado.
          async: 300
          poll: 5
          # retries: 100 era heranca de quando a task nao tinha teto. Com o
          # async acima, cada tentativa ja e limitada, e 100 delas multiplicariam
          # o pior caso por 100 sem ganho nenhum.
          retries: 2
          delay: 10
          until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)
          when: ansible_os_family == "Debian"

        - name: Restartar o Docker service
          service:
            name: docker
            state: restarted
            enabled: yes
          become: yes

        - name: Adicionar o usuario ec2-user ao grupo docker
          user:
            name: ec2-user
            groups: docker
            append: yes
          become: yes
          when: ansible_os_family == "RedHat"

        - name: Adicionar o usuario ubuntu ao grupo docker
          user:
            name: ubuntu
            groups: docker
            append: yes
          become: yes
          when: ansible_os_family == "Debian"
          
# https://docs.docker.com/compose/install/linux/#install-the-plugin-manually
# https://github.com/docker/compose/issues/7472#issuecomment-749993557
#
# O binario ficava em /usr/local/bin/docker-compose, o que atende apenas
# "docker-compose" (com hifen). "docker compose" (com espaco) e um plugin da
# CLI do docker, e so existe se o binario estiver num diretorio de
# cli-plugins. No Ubuntu o "docker-compose-plugin" do repo docker-ce supria
# isso; no Amazon Linux o pacote "docker" nao traz plugin nenhum, e o
# "docker compose" simplesmente nao existia.
#
# Instalamos o plugin pinado em todas as distros, e nao so onde falta, para
# que todos os labs fiquem na mesma versao. A precedencia e deterministica:
# defaultSystemPluginDirs (docker/cli, cli-plugins/manager/manager_unix.go)
# busca nesta ordem --
#
#   1. ~/.docker/cli-plugins
#   2. /usr/local/lib/docker/cli-plugins    <- onde gravamos
#   3. /usr/local/libexec/docker/cli-plugins
#   4. /usr/lib/docker/cli-plugins
#   5. /usr/libexec/docker/cli-plugins      <- onde o apt do docker-ce grava
#
# ou seja, o nosso vence o do pacote apt no Ubuntu.
  - name: Instalar os plugins da CLI do docker (compose e buildx)
    hosts: all
    become: yes
    vars:
      docker_plugin_dir: /usr/local/lib/docker/cli-plugins
      # Releases em https://github.com/docker/compose/releases
      # Ao trocar a versao, atualizar o checksum publicado ao lado do binario:
      #   curl -sL https://github.com/docker/compose/releases/download/<v>/docker-compose-linux-x86_64.sha256
      compose_version: "v5.6.1"
      compose_sha256: "47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0"
      # Releases em https://github.com/docker/buildx/releases
      # O "docker compose build" exige buildx >= 0.17.0. O checksum sai do
      # checksums.txt da release:
      #   curl -sL https://github.com/docker/buildx/releases/download/<v>/checksums.txt | grep linux-amd64
      buildx_version: "v0.38.2"
      buildx_sha256: "7992ec09413b80ff57ba4e081f56fc833d7bac1d5e71143c6c809e7e6065f6d6"
    tasks:
        - name: Criar o diretorio de cli-plugins do docker
          ansible.builtin.file:
            path: "{{ docker_plugin_dir }}"
            state: directory
            mode: '0755'

        - name: Instalar o plugin do docker compose
          # get_url no lugar de "curl -L": e idempotente (nao rebaixa 32 MB a
          # cada run do ajustar.sh) e falha alto. O curl sem --fail gravava a
          # pagina de erro como se fosse o binario e dava chmod +x nela -- o
          # mesmo problema que ja apareceu no kubectl da VM do lab.
          ansible.builtin.get_url:
            url: "https://github.com/docker/compose/releases/download/{{ compose_version }}/docker-compose-linux-x86_64"
            dest: "{{ docker_plugin_dir }}/docker-compose"
            checksum: "sha256:{{ compose_sha256 }}"
            mode: '0755'

        - name: Manter o atalho docker-compose que os scripts do lab esperam
          # cluster/config-node*.sh, shift/config/*.sh e verificar.sh checam
          # /usr/local/bin/docker-compose. Mesmo wrapper que o
          # ansible_docker_latest.yml ja usa.
          ansible.builtin.copy:
            dest: /usr/local/bin/docker-compose
            mode: '0755'
            content: |
              #!/bin/sh
              exec docker compose "$@"

        - name: Verificar o docker compose
          # Nao fala com o daemon: e o plugin reportando a propria versao.
          # Serve para a etapa acusar a falta em vez de deixar passar.
          ansible.builtin.command: docker compose version
          register: compose_check
          changed_when: false

        - name: Mostrar a versao do docker compose
          ansible.builtin.debug:
            msg: "{{ compose_check.stdout }}"

        # O "docker compose build" delega o build ao buildx e aborta com
        # "compose build requires buildx 0.17.0 or later" se o plugin faltar.
        # No Ubuntu o docker-buildx-plugin vem do repo docker-ce; no Amazon
        # Linux o pacote "docker" nao traz plugin nenhum, mesma lacuna que o
        # compose tinha. Instalado aqui pelo mesmo caminho, para todas as
        # distros ficarem na mesma versao.
        - name: Instalar o plugin do docker buildx
          ansible.builtin.get_url:
            url: "https://github.com/docker/buildx/releases/download/{{ buildx_version }}/buildx-{{ buildx_version }}.linux-amd64"
            dest: "{{ docker_plugin_dir }}/docker-buildx"
            checksum: "sha256:{{ buildx_sha256 }}"
            mode: '0755'

        - name: Verificar o docker buildx
          ansible.builtin.command: docker buildx version
          register: buildx_check
          changed_when: false

        - name: Mostrar a versao do docker buildx
          ansible.builtin.debug:
            msg: "{{ buildx_check.stdout }}"
