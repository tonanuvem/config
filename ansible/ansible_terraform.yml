---
- name: Instalar Terraform CLI e tambem Ansible CLI + AWS CLI
  hosts: all
  become: true
  tasks:
    - name: Verificar se o Terraform já está instalado
      # "command -v" retorna rc 0/1 normalmente; evita o erro barulhento
      # "executable not found" (com ignore_errors) quando o binario falta.
      ansible.builtin.shell: command -v terraform
      register: terraform_check
      changed_when: false
      failed_when: false

    - name: Mostrar versão atual do Terraform (se existir)
      debug:
        msg: "Terraform já está instalado: {{ terraform_check.stdout }}"
      when: terraform_check.rc == 0

    - name: Instalar dependências (Ubuntu/Debian)
      apt:
        name:
          - curl
          - unzip
        state: present
        update_cache: yes
      when: 
        - terraform_check.rc != 0
        - ansible_os_family == "Debian"

    - name: Instalar dependências (Amazon Linux/RHEL/CentOS)
      yum:
        name:
          - curl
          - unzip
        state: present
      when: 
        - terraform_check.rc != 0
        - ansible_os_family == "RedHat"

    - name: Detectar arquitetura do sistema
      command: uname -m
      register: system_arch
      changed_when: false
      when: terraform_check.rc != 0

    - name: Definir arquitetura para download
      set_fact:
        terraform_arch: "{{ 'amd64' if system_arch.stdout == 'x86_64' else 'arm64' if system_arch.stdout in ['aarch64', 'arm64'] else 'amd64' }}"
      when: terraform_check.rc != 0

    - name: Baixar Terraform
      get_url:
        url: "https://releases.hashicorp.com/terraform/1.16.0/terraform_1.16.0_linux_{{ terraform_arch }}.zip"
        dest: /tmp/terraform_linux_{{ terraform_arch }}.zip
        mode: '0644'
      when: terraform_check.rc != 0

    - name: Criar diretório temporário para extração
      file:
        path: /tmp/terraform_extract
        state: directory
        mode: '0755'
      when: terraform_check.rc != 0

    - name: Extrair Terraform
      unarchive:
        src: /tmp/terraform_linux_{{ terraform_arch }}.zip
        dest: /tmp/terraform_extract
        remote_src: yes
      when: terraform_check.rc != 0

    - name: Mover Terraform para /usr/local/bin
      copy:
        src: /tmp/terraform_extract/terraform
        dest: /usr/local/bin/terraform
        mode: '0755'
        remote_src: yes
      when: terraform_check.rc != 0

    - name: Limpar arquivos temporários
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/terraform_linux_{{ terraform_arch }}.zip
        - /tmp/terraform_extract
      when: terraform_check.rc != 0

    - name: Verificar instalação do Terraform
      command:
        argv:
          - /usr/local/bin/terraform
          - version
      register: terraform_version
      changed_when: false

    - name: Mostrar versão instalada do Terraform
      debug:
        msg: "Terraform instalado com sucesso: {{ terraform_version.stdout }}"

    # ============================================================
    # Instalar Ansible em ambiente virtual
    # ============================================================

    - name: Verificar se o Ansible já está instalado
      stat:
        path: /opt/ansible_venv/bin/ansible
      register: ansible_installed

    - name: Instalar dependências do Ansible
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true
      when:
        - not ansible_installed.stat.exists
        - ansible_os_family == "Debian"

    - name: Criar ambiente virtual do Ansible
      command:
        cmd: python3 -m venv /opt/ansible_venv
      when: not ansible_installed.stat.exists

    - name: Atualizar pip do ambiente virtual
      command:
        cmd: /opt/ansible_venv/bin/pip install --upgrade pip
      when: not ansible_installed.stat.exists

    - name: Instalar Ansible
      command:
        cmd: /opt/ansible_venv/bin/pip install --no-cache-dir ansible
      when: not ansible_installed.stat.exists

    - name: Configurar Ansible no PATH global
      become: true
      copy:
        dest: /etc/profile.d/ansible.sh
        mode: "0644"
        content: |
          export ANSIBLE_VENV=/opt/ansible_venv
          export PATH=$ANSIBLE_VENV/bin:$PATH

    - name: Adicionar Ansible ao PATH do sistema
      become: true
      lineinfile:
        path: /etc/environment
        regexp: '^PATH='
        line: 'PATH="/opt/ansible_venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'

    - name: Verificar versão do Ansible
      command:
        cmd: /opt/ansible_venv/bin/ansible --version
      register: ansible_version_result
      changed_when: false

    - name: Mostrar versão do Ansible
      debug:
        msg: "{{ ansible_version_result.stdout }}"

    # ============================================================
    # Instalar AWS CLI v2
    # ============================================================

    - name: Verificar se a AWS CLI já está instalada
      command:
        cmd: aws --version
      register: awscli_check
      changed_when: false
      failed_when: false

    - name: Detectar arquitetura para AWS CLI
      set_fact:
        awscli_arch: >-
          {{
            'x86_64'
            if ansible_architecture == 'x86_64'
            else 'aarch64'
            if ansible_architecture in ['aarch64', 'arm64']
            else ''
          }}
      when: awscli_check.rc != 0

    - name: Validar arquitetura suportada
      fail:
        msg: "Arquitetura não suportada para instalação da AWS CLI: {{ ansible_architecture }}"
      when:
        - awscli_check.rc != 0
        - awscli_arch == ''

    - name: Baixar AWS CLI v2
      get_url:
        url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ awscli_arch }}.zip"
        dest: "/tmp/awscliv2.zip"
        mode: "0644"
      when: awscli_check.rc != 0

    - name: Criar diretório temporário da AWS CLI
      file:
        path: /tmp/aws
        state: directory
        mode: "0755"
      when: awscli_check.rc != 0

    - name: Extrair AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: awscli_check.rc != 0

    - name: Instalar AWS CLI v2
      command:
        cmd: /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
      when: awscli_check.rc != 0

    - name: Limpar arquivos temporários da AWS CLI
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws
      when: awscli_check.rc != 0

    - name: Verificar instalação da AWS CLI
      command:
        cmd: /usr/local/bin/aws --version
      register: awscli_version_result
      changed_when: false

    - name: Mostrar versão da AWS CLI
      debug:
        msg: "{{ awscli_version_result.stdout }}"
